name: Windows TSF feasibility

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-tsf-x64:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure native TSF project
        run: cmake -S native/Srabon.Tsf -B build/native/Srabon.Tsf -A x64

      - name: Build x64 TSF DLL, unit tests, and profile activator
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $log = Join-Path $PWD 'build/native/Srabon.Tsf/build.log'
          cmake --build build/native/Srabon.Tsf --config Release --parallel --verbose 2>&1 | Tee-Object -FilePath $log
          $buildExit = $LASTEXITCODE
          if ($buildExit -ne 0) {
            $diagnostics = Select-String -Path $log -Pattern '(?i)(error|fatal|failed|undefined reference)' | Select-Object -Last 30
            if ($diagnostics) {
              foreach ($line in $diagnostics) { Write-Host "::error title=Native TSF build::$($line.Line)" }
            } else {
              Get-Content $log -Tail 80 | ForEach-Object { Write-Host "::error title=Native TSF build::$_" }
            }
            exit $buildExit
          }

      - name: Upload build diagnostics if the job failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: srabon-tsf-build-diagnostics
          path: build/native/Srabon.Tsf/build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Run native converter regression tests
        run: ctest --test-dir build/native/Srabon.Tsf -C Release --output-on-failure

      - name: Stage x64 feasibility package
        shell: pwsh
        run: |
          $stage = Join-Path $PWD 'artifacts/srabon-tsf-x64'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item 'build/native/Srabon.Tsf/Release/Srabon.Tsf.dll' $stage
          Copy-Item 'native/Srabon.Tsf/Install.ps1' $stage
          Copy-Item 'native/Srabon.Tsf/Uninstall.ps1' $stage
          Copy-Item 'native/Srabon.Tsf/README.md' $stage
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath 'artifacts/srabon-tsf-feasibility-x64.zip' -Force

      - name: Upload unsigned TSF feasibility package
        uses: actions/upload-artifact@v4
        with:
          name: srabon-tsf-feasibility-x64
          path: artifacts/srabon-tsf-feasibility-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Exercise registration, activation, typing, and candidate commit in Notepad
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $log = Join-Path $PWD 'build/native/Srabon.Tsf/notepad-test.log'
          & pwsh -NoLogo -NoProfile -ExecutionPolicy Bypass -File native/Srabon.Tsf/notepad-integration.ps1 2>&1 | Tee-Object -FilePath $log
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            $lines = Get-Content $log -Tail 30
            foreach ($line in $lines) {
              $message = [string]$line -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
              Write-Host "::error title=Notepad TSF integration::$message"
            }
            exit $testExit
          }

      - name: Upload Notepad integration diagnostics if the job failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: srabon-tsf-notepad-diagnostics
          path: build/native/Srabon.Tsf/notepad-test.log
          if-no-files-found: ignore
          retention-days: 7
